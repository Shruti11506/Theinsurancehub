<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Disable browser scroll restoration so we always start at top
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      // Ensure page starts at top on load and refresh
      window.scrollTo(0, 0);
      document.addEventListener('DOMContentLoaded', function() {
        window.scrollTo(0, 0);
      });
      window.addEventListener('pageshow', function() {
        window.scrollTo(0, 0);
      });
    </script>
    
    <!-- Primary Meta Tags -->
    <title>TheInsuranceHub - All Companies, Insurance & Mutual Funds Under One Roof</title>
    <meta name="title" content="TheInsuranceHub - All Companies, Insurance & Mutual Funds Under One Roof" />
    <meta name="description" content="Confused about choosing the right insurance? Get all top companies, health policies, term life insurance plans, and high-performing mutual funds under one roof with instant online comparison & claims assistance." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TheInsuranceHub - All Companies, Insurance & Mutual Funds Under One Roof" />
    <meta property="og:description" content="Confused about choosing the right insurance? Compare and secure health, life, car plans, and mutual funds side-by-side with 100% transparency." />
    
    <!-- Google Fonts Preconnect & Optimized Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" />
  </head>
  <body class="bg-slate-50 antialiased text-slate-800">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
